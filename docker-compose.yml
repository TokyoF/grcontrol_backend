version: "3.9"
services:
  grcontrol-db:
    image: postgres:15-alpine
    container_name: grcontrol
    restart: always
    environment:
      POSTGRES_DB: grcontrol_db
      POSTGRES_USER: grcontrol_user
      POSTGRES_PASSWORD: grcontrol_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
